name: Windows tests

# The Pester suite under windows/tests was never run by CI, which is exactly how three
# assertions drifted out of sync with the modules and stayed that way: they asserted PT30S
# where the code said PT5S, a scoop shim path the launcher had stopped using, and a mock
# trigger missing the Delay the module compares. Nothing failed, because nothing ran them.
#
# The suite is written against the Pester 3.4.0 that ships in Windows PowerShell 5.1, not the
# Pester 5 syntax (`Should Match`, not `Should -Match`), so it runs under powershell.exe with
# -MaximumVersion pinned. Newer Pester is present on the runner and would reject the syntax.

on:
  push:
    paths:
      - "windows/**"
      - "home-manager/dotfiles/windows/**"
      - "configs/shortcuts/**"
      - ".github/workflows/windows-tests.yml"
  pull_request:
    paths:
      - "windows/**"
      - "home-manager/dotfiles/windows/**"
      - "configs/shortcuts/**"
      - ".github/workflows/windows-tests.yml"
  workflow_dispatch:

jobs:
  pester:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # AutoHotkey khong co san tren runner. Truoc day dieu do khien
      # ahkRuntimeSafety.Tests.ps1 phai loai khoi CI. Ban parser thi khac: neu
      # no khong chay tren CI thi ca thiet ke "ba parser khong the lech nhau"
      # mat mot chan.
      #
      # Ghim version + checksum, giong cach repo-hygiene.yml ghim gitleaks.
      #
      # windows/tests/shortcutsParse.Tests.ps1 chua ton tai -- no thuoc Task 5,
      # con cho phan cung that de kiem. Cai AutoHotkey truoc ca file tieu thu no
      # la co y: pin download + checksum nay duoc chung minh chay dung tren CI
      # truoc khi Task 5 ha canh, thay vi ca hai cung lam moi mot luc. Pester
      # glob *.Tests.ps1 nen mot file con thieu don gian la khong chay, khong
      # phai loi.
      - name: Cai AutoHotkey v2 (pin version + checksum)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = '2.0.19'
          $sha = '4e0d0e65655066a646a210951320feaef0729a3597177131adaec4066bef5869'
          $url = "https://github.com/AutoHotkey/AutoHotkey/releases/download/v$ver/AutoHotkey_$ver.zip"
          Invoke-WebRequest -Uri $url -OutFile ahk.zip
          $got = (Get-FileHash ahk.zip -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $sha) { throw "checksum lech: $got" }
          Expand-Archive ahk.zip -DestinationPath "$env:RUNNER_TEMP\ahk"
          "AHK_EXE=$env:RUNNER_TEMP\ahk\AutoHotkey64.exe" |
            Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Run Pester
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          Import-Module Pester -MaximumVersion 4.99.99
          $pester = Get-Module Pester
          Write-Host "Pester $($pester.Version) from $($pester.ModuleBase)"
          if ($pester.Version.Major -ge 5) {
            throw "need the in-box Pester 3.x; got $($pester.Version)"
          }

          # ahkRuntimeSafety is the one file that launches AutoHotkey for real -- proving
          # switch-language.ahk survives a missing target window, and that launch-ahk.ahk
          # parses. AutoHotkey IS on the runner now (see the install step above), but that
          # step drops it at $env:RUNNER_TEMP\ahk\AutoHotkey64.exe for the future
          # shortcuts-parser tests, while this file hardcodes
          # 'C:\Program Files\AutoHotkey\v2\AutoHotkey64.exe' and does not read $env:AHK_EXE.
          # So it still finds nothing and stays a local check -- exclude it here for that
          # reason, not because the binary is absent.
          #
          # It is the ONLY excluded file, so nothing else may hide there: assertions that just
          # read the .ahk files as text belong in switchLanguage.Tests.ps1. One that did sit
          # here drifted through the whole move to tongue unnoticed, for exactly this reason.
          $files = Get-ChildItem "$env:GITHUB_WORKSPACE\windows\tests" -Filter *.Tests.ps1 |
            Where-Object { $_.Name -ne 'ahkRuntimeSafety.Tests.ps1' }
          Write-Host "Running: $(($files.Name) -join ', ')"

          $result = Invoke-Pester -Path $files.FullName -PassThru
          Write-Host "Passed=$($result.PassedCount) Failed=$($result.FailedCount)"
          if ($result.FailedCount -gt 0) {
            $result.TestResult | Where-Object { -not $_.Passed } | ForEach-Object {
              Write-Host "::error::$($_.Describe) > $($_.Name): $($_.FailureMessage)"
            }
            exit 1
          }
