name: Eval

# Every flake output must still evaluate. This is the gate that was missing
# when desktop/x1g6/vmware rotted: renaming a module in home-manager/ silently
# breaks any host that has not been rebuilt since, and nothing catches it.
#
# `nix flake check` is not usable here -- lib/mkConfigs.nix reads
# builtins.currentSystem and $USER, so eval is impure by design. `nix eval
# --impure` per host gives the same coverage.
#
# --system pins the host's real architecture, so a14/vmware (aarch64) are
# checked from the x86_64 runner too. Eval only; nothing is built.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # lib/mkConfigs.nix derives repoPath as $HOME/.nix, and every real
      # host keeps a real working tree there (CLAUDE.md is explicit about
      # this). actions/checkout puts the repo at $GITHUB_WORKSPACE instead,
      # so a module that builtins.readFile's something under repoPath at
      # eval time (services.dotbrave on macmini today; any host could add
      # one next) dies on CI with "path ... does not exist" even though the
      # same eval works on every real machine. Symlinking closes that gap
      # instead of special-casing around it -- delete this and the trap is
      # back, silently, for the first Linux host that grows a module like it.
      #
      # `rm -rf` first: `ln -sfn` does NOT replace a pre-existing REAL
      # directory at the target -- it drops the new symlink *inside* it
      # instead (named after $GITHUB_WORKSPACE's basename), leaving a stale
      # $HOME/.nix in place and the eval failure just as unexplained.
      # Runners are ephemeral, so removing $HOME/.nix here is safe -- the
      # GITHUB_ACTIONS check exists so this cannot be copy-pasted onto a
      # real machine and rm -rf a real working tree.
      - name: Point $HOME/.nix at the checkout
        run: |
          if [ "$GITHUB_ACTIONS" != "true" ]; then
            echo "refusing: this removes \$HOME/.nix and must only run on an ephemeral CI runner" >&2
            exit 1
          fi
          rm -rf "$HOME/.nix"
          ln -s "$GITHUB_WORKSPACE" "$HOME/.nix"

      - uses: DeterminateSystems/nix-installer-action@main

      - name: homeConfigurations
        run: |
          for h in rog server desktop minimal; do
            echo "::group::hm/$h"
            nix eval --impure --system x86_64-linux ".#homeConfigurations.$h.activationPackage.drvPath"
            echo "::endgroup::"
          done
          echo "::group::hm/a14"
          nix eval --impure --system aarch64-linux ".#homeConfigurations.a14.activationPackage.drvPath"
          echo "::endgroup::"

      - name: nixosConfigurations
        run: |
          echo "::group::nixos/x1g6"
          nix eval --impure --system x86_64-linux ".#nixosConfigurations.x1g6.config.system.build.toplevel.drvPath"
          echo "::endgroup::"
          echo "::group::nixos/vmware"
          nix eval --impure --system aarch64-linux ".#nixosConfigurations.vmware.config.system.build.toplevel.drvPath"
          echo "::endgroup::"

      - name: systemConfigs
        run: |
          nix eval --impure ".#systemConfigs.x86_64-linux.desktop.drvPath"
          nix eval --impure ".#systemConfigs.aarch64-linux.a14.drvPath"

  darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Same invariant as the linux job above: repoPath is $HOME/.nix, and
      # services.dotbrave here (hosts/macmini) reads brave.toml through it
      # at eval time. Without this the darwin job is the one that actually
      # dies today -- keep it, do not "simplify" it back out. The rm -rf +
      # GITHUB_ACTIONS guard is explained in the linux job above; kept
      # identical here on purpose.
      - name: Point $HOME/.nix at the checkout
        run: |
          if [ "$GITHUB_ACTIONS" != "true" ]; then
            echo "refusing: this removes \$HOME/.nix and must only run on an ephemeral CI runner" >&2
            exit 1
          fi
          rm -rf "$HOME/.nix"
          ln -s "$GITHUB_WORKSPACE" "$HOME/.nix"

      - uses: DeterminateSystems/nix-installer-action@main

      - name: darwinConfigurations
        run: |
          for h in macmini airm3; do
            echo "::group::darwin/$h"
            nix eval --impure ".#darwinConfigurations.$h.system.drvPath"
            echo "::endgroup::"
          done

  shortcuts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # nix_path: cac job linux/darwin o tren chi dung flake output
      # (.#homeConfigurations...) nen khong bao gio can <nixpkgs>. Job nay thi
      # co -- check-consumers.sh va cau lenh duoi day deu `import <nixpkgs>`.
      # DeterminateSystems/nix-installer-action (dung o hai job tren) khong tu
      # dang ky channel nao, va cachix/install-nix-action cung vay neu bo qua
      # nix_path -- ca hai deu de <nixpkgs> khong resolve tren runner sach.
      # Ghim theo dung ref cua flake.lock (nixpkgs-unstable) de mot lan nix
      # eval khong lech ban voi flake output cua chinh repo nay.
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable

      # Golden file la trong tai: ca ba parser deu so voi no, khong ai so
      # truc tiep voi ai. Nho vay job Windows kiem duoc ban AHK ma khong can
      # noi chuyen voi job nay.
      - name: sync.sh phai da duoc chay
        run: |
          nix shell nixpkgs#lua -c ./configs/shortcuts/sync.sh
          git diff --exit-code configs/shortcuts/

      - name: Test parser Lua
        run: LC_ALL=C nix shell nixpkgs#lua -c lua configs/shortcuts/parse_test.lua

      - name: Duong Nix phai khop golden
        run: |
          for t in gnome macos sway windows; do
            nix eval --impure --raw --expr \
              "import ./configs/shortcuts/dump.nix { target = \"$t\"; }"
          done | diff - configs/shortcuts/apps.expected.tsv

      - name: Hai module tieu thu phai khop golden
        run: nix shell nixpkgs#jq -c ./configs/shortcuts/check-consumers.sh

      # File per-target moi (plan beckon-serve). Chay --check bang DUNG rev
      # beckon da pin trong flake.lock — CI kiem cung mot binary ma cac host
      # se deploy, khong phai main moi nhat. `nix run` build beckon tu source
      # tren runner (~vai phut, khong cache) — chap nhan duoc voi tan suat
      # push cua repo nay.
      - name: beckon --check moi file apps.*.toml
        run: |
          rev="$(nix eval --raw --impure --expr \
            '(builtins.fromJSON (builtins.readFile ./flake.lock)).nodes.beckon.locked.rev')"
          for f in configs/shortcuts/apps.*.toml; do
            [ "$f" = "configs/shortcuts/apps.toml" ] && continue   # file CU (gnome/sway) — plan 4 xu ly
            nix run "github:xom11/beckon/$rev" -- --check "$f"
          done
