git:
  diffRenderers:
    - colorArg: always
      command: delta --dark --paging=never
customCommands:
  - key: "e"
    context: "files"
    command: "nvim {{.SelectedFile.Name}}"
    output: terminal
  # Diff với diffnav
  - key: "D"
    context: "commits"
    command: "git diff {{.SelectedLocalCommit.Sha}}^ {{.SelectedLocalCommit.Sha}} | diffnav"
    output: terminal
  - key: "D"
    context: "files"
    command: "git diff | diffnav"
    output: terminal
  - key: "D"
    context: "localBranches"
    command: "git diff {{.SelectedLocalBranch.Name}} | diffnav"
    output: terminal
