# Drag and drop via dragon
[[mgr.prepend_keymap]]
on  = "<C-n>"
run = 'shell -- ripdrag %s -x 2>/dev/null &'

# Linux: Copy selected files to the system clipboard while yanking
[[mgr.prepend_keymap]]
on  = "y"
run = [ "shell -- echo '$1' | xclip -i -selection clipboard -t text/uri-list", "yank" ]

# cd back to the root of the current Git repository
[[mgr.prepend_keymap]]
on = [ "g", "r" ]
run = 'shell -- ya emit cd "$(git rev-parse --show-toplevel)"'

# neo-tree muscle memory: Enter must not open files -- o does that.
# Builtin `enter` is directory-only since 26.x, so no plugin needed.
[[mgr.prepend_keymap]]
on   = "l"
run  = "enter"
desc = "Enter the child directory"

[[mgr.prepend_keymap]]
on   = "<Enter>"
run  = "enter"
desc = "Enter the child directory"

[[mgr.prepend_keymap]]
on   = "!"
for  = "unix"
run  = 'shell "$SHELL" --block'
desc = "Open $SHELL here"

# If you also using Yazi on Windows:
[[mgr.prepend_keymap]]
on   = "!"
for  = "windows"
run  = 'shell "powershell.exe" --block'
desc = "Open PowerShell here"
