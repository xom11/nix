# The daemon reads this at ~/.config/vietc/config.toml -- NOT vietc.toml, which is
# only looked up in the current directory. Get the name wrong and the config is
# silently ignored in favour of built-in defaults.
#
# Read-only from the daemon's side; what it WRITES is overrides.toml beside it,
# deliberately not symlinked into the repo.

input_method = "telex"
toggle_key = "space"
start_enabled = true

# Must stay false here: kanata already EVIOCGRABs the real keyboard. vietc's
# correct path on sway/hyprland is zwp_input_method_v2, which is rootless and
# collides with nothing. Only set true on a machine WITHOUT kanata.
grab = false
debug = false

[auto_restore]
enabled = true
trigger_keys = [
    "space",
    "escape",
]

[app_state]
enabled = true
# Terminals were REMOVED from this list, unlike upstream, which treats them as
# English-only -- disabling by default the very thing vietc was adopted for.
english_apps = [
    "code",
    "jetbrains",
    "intellij",
    "pycharm",
    "webstorm",
]
vietnamese_apps = [
    "telegram",
    "discord",
    "slack",
    "firefox",
    "chromium",
    "thunderbird",
]

# Deliberately empty. Upstream ships abbreviation macros, harmless in chat but
# this IME runs IN A TERMINAL, where those short strings are real command and
# variable names -- a macro firing mid-command line breaks it silently.
[macros]
