# Local detection-manifest override for Claude Code.
#
# Herdr treats Claude Code as a screen-detected agent, not a lifecycle
# authority: ~/.claude/hooks/herdr-agent-state.sh only sends
# pane.report_agent_session (session identity), never a state. So every
# working/idle call comes from reading the pane.
#
# The only rule that yields `working` upstream is osc_title_working: a busy
# spinner at the head of the OSC title. Claude swaps that spinner for U+2733 the
# moment a turn ends, so a turn that ends while background work is still running
# (a shell waiting on CI, a Monitor, an MCP task) falls through to
# live_prompt_box and the pane shows a green idle tick while the work is still
# in flight. Upstream bug, still open:
# https://github.com/herdrdev/herdr/issues/1217
#
# Claude's footer does expose the fact though — the hints line carries a
# one-slot summary of live background work for as long as any of it is alive,
# and drops the slot when the last one exits. background_task_working below
# keys off that.
#
# Everything else in this file is a verbatim copy of the upstream remote
# manifest (~/.local/state/herdr/agent-detection/remote/claude.toml) at the
# version recorded below. A local override ALWAYS wins and stops remote updates
# from applying to this agent, and that has already cost one silent regression:
# Claude Code 2.1.228 swapped the OSC-title busy spinner from braille to the
# half-circles U+25D0-U+25D3, upstream shipped the wider class in 2026.08.13.1,
# and this copy — frozen at 2026.08.04.1 — kept matching braille only. Every
# working pane fell through to live_prompt_box and showed a green idle tick
# while it was mid-turn. Nothing warns you: the override still loads, still
# matches its own rules, and the panes look merely quiet. So re-sync it against
# upstream now and then:
#   diff ~/.local/state/herdr/agent-detection/remote/claude.toml \
#        ~/.nix/home-manager/programs/herdr/herdr.d/agent-detection/claude.toml
# Apply edits without restarting the server (attached panes survive):
#   herdr server reload-agent-manifests
# Drop the override entirely to go back to upstream behaviour.

id = "claude"
version = "2026.08.13.1"
min_engine_version = 2
updated_at = "2026-08-13T00:00:00Z"
aliases = ["claude-code"]

[[rules]]
id = "osc_title_working"
state = "working"
priority = 1100
region = "osc_title"
visible_working = true
# Braille covers <= 2.1.227; half-circles are the 2.1.228 busy spinner.
regex = ['^[\x{2800}-\x{28FF}\x{25D0}-\x{25D3}] ']

[[rules]]
id = "btw_overlay_working"
state = "working"
priority = 975
region = "bottom_non_empty_lines(5)"
visible_working = true
line_regex = [
  '^\s*/btw(?:\s|$)',
  '(?i)esc to close\s*$',
]

# LOCAL ADDITION — not upstream.
# Sits above live_prompt_box (950) so a finished turn with live background work
# reads as working, and below btw_overlay_working (975) so nothing that already
# claims the pane loses. The `not` list mirrors live_prompt_box's so an approval
# prompt still wins as `blocked` even while background work runs — that list is
# why the region stays `after_last_horizontal_rule` (which spans the statusline
# AND the hints line) instead of narrowing to the hints line alone: narrowing it
# would put "do you want to proceed?" out of reach and let a 960 `working` beat
# generic_permission_prompt at 840.
#
# Claude reports every kind of background work through ONE footer slot, and the
# wording is a closed set — read it off `IRt` in the bundle, which is the only
# thing that renders these counts:
#   N shell(s) · N monitor(s) · N team(s) · N local agent(s)
#   N background dynamic workflow(s) · N MCP task(s) (or job(s), gated)
#   N background task(s)   <- the fallback whenever the live types are MIXED
# The mixed-type fallback matters more than it looks: one shell plus one MCP
# task renders `2 background tasks`, and neither noun appears.
# Deliberately NOT matched: `N loops` (a registered cron is not running work,
# and matching it would pin the pane to working forever), `auto-mode scan`
# (no count, one-shot setup scan), and anything remote — `cloud session`,
# `ultraplan`, `dreaming` never reach this slot, the producer filters them out.
#
# Anchor on `^` or `·`, never on a bare count. This region also holds the
# statusline, whose first field is the session title — user text. Requiring the
# count to open the line or follow a separator keeps a title like
# "Sua 3 MCP tasks bi treo" from pinning the pane to working. It also has to be
# `^`-OR-`·` rather than `·` alone: the summary is only preceded by a separator
# when a mode indicator sits to its left, so in default mode the line opens
# `  1 MCP task · ← for agents` with nothing in front of the count. The old
# `·`-only form silently missed every non-bypass pane.
# `← N agents` / `← N done` on the same line are the fleet nudge, a different
# signal; they stay unmatched because `agents` is not in the alternation.
#
# Trade-off: any surviving background work counts, including something parked
# on purpose (a dev server, a tail -f). Such a pane reads working until it
# exits. The screen carries no way to tell the two apart.
[[rules]]
id = "background_task_working"
state = "working"
priority = 960
region = "after_last_horizontal_rule"
visible_working = true
line_regex = ['(?i)(?:^|·)\s*\d+\s+(?:shells?|monitors?|teams?|local\s+agents?|MCP\s+(?:tasks?|jobs?)|background\s+(?:dynamic\s+workflows?|tasks?))\b']
not = [
  { contains = ["enter to select"] },
  { contains = ["esc to cancel"] },
  { contains = ["tab/arrow keys"] },
  { contains = ["arrow keys to navigate"] },
  { contains = ["↑/↓ to navigate"] },
  { contains = ["do you want to proceed?"] },
]

[[rules]]
id = "transcript_viewer"
state = "unknown"
priority = 1000
region = "bottom_non_empty_lines(3)"
skip_state_update = true
contains = ["showing detailed transcript"]
any = [
  { contains = ["ctrl+o", "to toggle"] },
  { contains = ["ctrl+e", "show all"] },
  { contains = ["ctrl+e", "collapse"] },
  { contains = ["↑↓ scroll"] },
  { contains = ["? for shortcuts"] },
]

[[rules]]
id = "live_blocked_form"
state = "blocked"
priority = 980
region = "after_last_horizontal_rule"
visible_blocker = true
contains = ["esc to cancel"]
any = [
  { contains = ["enter to confirm"] },
  { contains = ["enter to select"], any = [
    { contains = ["tab/arrow keys to navigate"] },
    { contains = ["arrow keys to navigate"] },
    { contains = ["arrows to navigate"] },
    { contains = ["↑/↓ to navigate"] },
    { contains = ["↑↓ to navigate"] },
  ] },
]

[[rules]]
id = "dynamic_workflow_prompt"
state = "blocked"
priority = 980
region = "whole_recent"
visible_blocker = true
contains = ["run a dynamic workflow?", "esc to cancel"]

[[rules]]
id = "live_prompt_box"
state = "idle"
priority = 950
region = "prompt_box_body"
visible_idle = true
line_regex = ['^\s*❯']
not = [
  { contains = ["enter to select"] },
  { contains = ["esc to cancel"] },
  { contains = ["tab/arrow keys"] },
  { contains = ["arrow keys to navigate"] },
  { contains = ["↑/↓ to navigate"] },
]

[[rules]]
id = "model_picker_menu"
state = "unknown"
priority = 900
region = "whole_recent"
skip_state_update = true
contains = ["select model", "enter to set as default", "esc to cancel"]
not = [
  { contains = ["do you want to proceed?"] },
  { contains = ["enter to select"] },
]

[[rules]]
id = "bash_permission_prompt"
state = "blocked"
priority = 850
region = "whole_recent"
visible_blocker = true
contains = ["do you want to proceed?"]
any = [
  { contains = ["bash command"] },
  { contains = ["bash("] },
  { contains = ["contains expansion"] },
  { contains = ["tab to amend"] },
  { contains = ["ctrl+e to explain"] },
]
all = [
  { any = [{ line_regex = ['(?i)^\s*❯?\s*yes\b'] }, { line_regex = ['(?i)^\s*1\.\s*yes\b'] }, { line_regex = ['(?i)^\s*2\.\s*no\b'] }] },
]

[[rules]]
id = "generic_permission_prompt"
state = "blocked"
priority = 840
region = "after_last_horizontal_rule"
visible_blocker = true
contains = ["do you want to proceed?", "esc to cancel"]
all = [
  { any = [
    { line_regex = ['(?i)^\s*❯?\s*1\.\s*yes\b'] },
    { line_regex = ['(?i)^\s*2\.\s*yes\b'] },
    { line_regex = ['(?i)^\s*2\.\s*no\b'] },
    { line_regex = ['(?i)^\s*3\.\s*no\b'] },
  ] },
]

[[rules]]
id = "legacy_no_prompt_blocker"
state = "blocked"
priority = 300
region = "whole_recent"
any = [
  { contains = ["do you want to"], any = [{ contains = ["yes"] }, { contains = ["❯"] }] },
  { contains = ["would you like to"], any = [{ contains = ["yes"] }, { contains = ["❯"] }] },
  { contains = ["waiting for permission"] },
  { contains = ["do you want to allow this connection?"] },
  { contains = ["tab to amend"] },
  { contains = ["ctrl+e to explain"] },
  { contains = ["do you want to proceed?", "esc to cancel"] },
  { contains = ["review your answers"] },
  { contains = ["skip interview and plan immediately"] },
]
not = [
  { regex = ['(?m)^\s*❯\s*$'] },
]

[[rules]]
id = "osc_title_idle"
state = "idle"
priority = 250
region = "osc_title"
visible_idle = true
regex = ['^\x{2733} ']

[[rules]]
id = "osc_progress_idle"
state = "idle"
priority = 250
region = "osc_progress"
regex = ['^4;0']
