# Windows package declarations, applied by windows/modules/packages/dotpkg.
# NEEDS dotpkg >= 0.2.0 for [winget.opts]; see CLAUDE.md for why.

[scoop]
buckets  = ["main", "extras", "xom11=https://github.com/xom11/scoop-bucket"]
packages = [
  "git", "nodejs", "gh", "bat", "ripgrep", "fzf", "fastfetch", "neovim",
  "tree-sitter", "lazygit", "lazydocker", "yazi", "zellij", "opencode",
  "shfmt", "yamlfmt", "stylua", "actionlint", "kanata", "beckon",
  "python", "go", "rustup", "uv", "age",

  # dotpkg declares itself; pkg.lock pins it by bucket commit. The module
  # bootstraps via scoop when PATH is empty, so this does not deadlock.
  # It CANNOT upgrade itself -- the running-process guard catches it, so a new
  # version reports held; upgrade with `scoop update dotpkg`.
  "dotpkg",
]

[scoop.opts]
python = { arch = "64bit" }   # native wheels are built against this
rustup = { arch = "keep" }    # post_install giu file, doi arch la mat rustup
# stylua is unpinned on arm64: the manifest only publishes 64bit, so a pin could
# never be satisfied. Re-add once the bucket carries arm64.

# Only declare things that do NOT self-update here: a self-updater passes the pin,
# dotpkg refuses to downgrade, and the whole run exits non-zero forever. Use
# [winget.opts] pin = "none" for those instead.
[winget]
packages = [
  "Microsoft.VisualStudioCode", "Obsidian.Obsidian", "Tailscale.Tailscale",
  "Brave.Brave", "Vivaldi.Vivaldi", "Google.Chrome", "Discord.Discord",
  "Warp.Warp", "ajeetdsouza.zoxide", "DEVCOM.JetBrainsMonoNerdFont",
  "7zip.7zip", "AutoHotkey.AutoHotkey", "gerardog.gsudo", "PhatMT97.VKey",
]
# Deliberately absent: VNGCorp.Zalo (winget download fails 0x80072f05, installed by
# hand), Raycast (dropped), Microsoft.PowerShell (MSIX only, and sshd cannot run a
# packaged app -- comes from the MSI instead), OhMyPosh (winget reports 30.6.4.0
# while the index says 30.6.4).

# Install if absent, never manage the version. Produces no pkg.lock entry.
[winget.opts]
"Brave.Brave"     = { pin = "none" }
"Vivaldi.Vivaldi" = { pin = "none" }
"Google.Chrome"   = { pin = "none" }
"Discord.Discord" = { pin = "none" }
"Warp.Warp"       = { pin = "none" }
# VS Code and Obsidian self-update too but have not drifted yet; move them to
# pin = "none" if they do, rather than chasing them with `update`.

# winget does not tell dotpkg the process name, so it guesses from the id. Only
# the ids where that guess misses are listed -- measured, not guessed again.
[winget.guard]
"Obsidian.Obsidian" = ["Obsidian"]
