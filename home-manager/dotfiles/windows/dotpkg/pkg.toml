# Khai bao goi cho Windows. Ap dung boi windows/modules/packages/dotpkg.
# CAN dotpkg >= 0.2.0 ([winget.opts]); ly do tung quyet dinh o CLAUDE.md muc "dotpkg".

[scoop]
buckets  = ["main", "extras", "xom11=https://github.com/xom11/scoop-bucket"]
packages = [
  "git", "nodejs", "gh", "bat", "ripgrep", "fzf", "fastfetch", "neovim",
  "tree-sitter", "lazygit", "lazydocker", "yazi", "zellij", "opencode",
  "shfmt", "yamlfmt", "stylua", "actionlint", "kanata", "beckon",
  "python", "go", "rustup", "uv", "age",

  # dotpkg khai bao chinh no: pkg.lock ghim no theo commit bucket. Module
  # bootstrap bang scoop khi PATH trong, nen vong nay khong tu khoa.
  # No KHONG tu nang cap duoc -- hang rao tien-trinh-dang-chay bat trung chinh
  # no, nen co ban moi thi `apply` bao held; nang bang `scoop update dotpkg`.
  "dotpkg",
]

[scoop.opts]
python = { arch = "64bit" }   # wheel native da build theo ban nay
rustup = { arch = "keep" }    # post_install giu file, doi arch la mat rustup
# stylua khong ghim arm64: manifest chi cong bo 64bit, ghim la khong bao gio
# thoa man duoc. Bucket co arm64 thi them lai.

# Chi khai o day thu KHONG tu cap nhat. App tu cap nhat vuot qua pin -> dotpkg
# tu choi downgrade -> ca run thoat khac 0 -> apply.ps1 do moi lan. Voi chung
# dung [winget.opts] pin = "none" ben duoi.
[winget]
packages = [
  "Microsoft.VisualStudioCode", "Obsidian.Obsidian", "Tailscale.Tailscale",
  "Brave.Brave", "Vivaldi.Vivaldi", "Google.Chrome", "Discord.Discord",
  "Warp.Warp", "ajeetdsouza.zoxide", "DEVCOM.JetBrainsMonoNerdFont",
  "7zip.7zip", "AutoHotkey.AutoHotkey", "gerardog.gsudo", "PhatMT97.VKey",
]
# Co y khong khai: VNGCorp.Zalo (winget download loi 0x80072f05, cai tay),
# 9PFXXSHC64H3 (Raycast, da bo), Microsoft.PowerShell (chi co MSIX, sshd khong
# chay duoc app dong goi -- den tu MSI, xem modules/packages/pwsh),
# JanDeDobbeleer.OhMyPosh (winget bao 30.6.4.0 con chi muc ghi 30.6.4).

# Cai neu chua co, khong bao gio quan version. Khong sinh entry pkg.lock.
[winget.opts]
"Brave.Brave"     = { pin = "none" }
"Vivaldi.Vivaldi" = { pin = "none" }
"Google.Chrome"   = { pin = "none" }
"Discord.Discord" = { pin = "none" }
"Warp.Warp"       = { pin = "none" }
# VS Code va Obsidian cung tu cap nhat nhung chua troi lan nao; troi thi chuyen
# sang pin = "none", dung chay update de duoi theo.

# winget khong cho dotpkg biet ten tien trinh, no phai doan tu id. Chi khai
# nhung id doan truot -- do tren may, khong phai doan lai.
[winget.guard]
"Obsidian.Obsidian" = ["Obsidian"]
