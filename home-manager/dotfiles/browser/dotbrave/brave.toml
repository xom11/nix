# Hand-maintained brave.toml -- originally produced by `dotbrave export`
# from a Linux profile, now edited directly and kept cross-platform.
# `Meta+` bindings below are translated by dotbrave itself: Command+ on
# macOS, Super+ on Linux/Windows -- so this one file applies everywhere.
#
# This file captures user-visible customizations from a Brave
# profile + managed-policy file:
#
#   [shortcuts] -- bindings that differ from Brave's defaults.
#   [settings]  -- well-known user-facing keys, keys dotbrave manages,
#                  and keys changed since the last `dotbrave export
#                  --snapshot`.
#   [pwa]       -- URLs currently force-installed via the managed-policy
#                  file / Windows registry.
#
# To capture a NEW setting from the browser UI: run `dotbrave export
# --snapshot`, change the setting, then `dotbrave export` again -- then
# reapply the Meta+ shortcut variants by hand, since export won't add
# them back for you.
#
# Apply this file with: `dotbrave apply <this file>`
# Originally exported from: /home/kln/.config/BraveSoftware/Brave-Browser/Default/Preferences

[shortcuts]
back = ["Alt+KeyH", "Meta+BracketLeft"]
forward = ["Alt+KeyL", "Meta+BracketRight"]
reload = ["Control+KeyR", "Meta+KeyR"]
new_tab = ["Control+KeyT", "Meta+KeyT"]
close_tab = ["Control+KeyW", "Meta+KeyW"]
select_next_tab = ["Alt+KeyJ"]
select_previous_tab = ["Alt+KeyK"]
focus_location = ["Control+KeyL", "Meta+KeyL"]
focus_search = ["Control+KeyS", "Meta+Alt+KeyF"]

[settings]
# currently managed by dotbrave:
"auto_pin_new_tab_groups" = false
"bookmark_bar.show_on_all_tabs" = false
"bookmark_bar.show_tab_groups" = false
"brave.ai_chat.autocomplete_provider_enabled" = false
"brave.ai_chat.context_menu_enabled" = false
"brave.ai_chat.show_toolbar_button" = false
"brave.always_show_bookmark_bar_on_ntp" = false
"brave.brave_search.show-ntp-chat" = false
"brave.brave_search.show-ntp-search" = false
"brave.brave_vpn.show_button" = false
"brave.enable_closing_last_tab" = false
"brave.enable_window_closing_confirm" = false
"brave.location_bar_is_wide" = false
"brave.mru_cycling_enabled" = true
"brave.new_tab_page.show_background_image" = false
"brave.new_tab_page.show_branded_background_image" = false
"brave.new_tab_page.show_brave_news" = false
"brave.new_tab_page.show_brave_vpn" = false
"brave.new_tab_page.show_clock" = false
"brave.new_tab_page.show_rewards" = false
"brave.new_tab_page.show_stats" = false
"brave.new_tab_page.show_together" = false
"brave.rewards.show_brave_rewards_button_in_location_bar" = false
"brave.show_fullscreen_reminder" = false
"brave.tabs.vertical_tabs_collapsed" = true
"brave.tabs.vertical_tabs_enabled" = true
"brave.today.should_show_toolbar_button" = false
"brave.wallet.show_wallet_icon_on_toolbar" = false
"browser.custom_chrome_frame" = true
"ntp.shortcust_visible" = false
"omnibox.prevent_url_elisions" = true

[pwa]
# Danh sach TOAN PHAN: Brave go moi PWA do policy cai ma khong con ten o day.
#
# web.telegram.org va chat.zalo.me co mat vi LINUX. Tren mac/Windows hai app do
# la ban native (apps.{macos,windows}.toml tro toi "Telegram"/"Zalo"), con
# apps.linux.toml phai tro toi PWA: Zalo khong co ban Linux, va Cap+t ben Linux
# CO Y khong dung telegram-desktop. Hai may kia van cai hai PWA nay theo danh
# sach dung chung -- chung nam khong, khong phim tat nao cham toi.
urls = [
  "https://chat.deepseek.com",
  "https://chat.zalo.me/",
  "https://chatgpt.com/",
  "https://claude.ai/new",
  "https://discord.com/app",
  "https://gemini.google.com",
  "https://keep.google.com",
  "https://mail.google.com/",
  "https://tao.lenamkhanh.xyz",
  "https://web.telegram.org/k/",
  "https://www.facebook.com/messages",
  "https://www.messenger.com",
  "https://www.notion.so/",
  "https://www.youtube.com",
]
