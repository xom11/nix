include theme.conf

background_opacity 0.95
dynamic_background_opacity yes
allow_remote_control yes

# FIX: ssh clipboard OSC 52 
clipboard_control write-clipboard write-primary read-clipboard read-primary 
confirm_os_window_close 0
enable_blur true
remember_window_size  yes
tab_bar_style separator
include current-theme.conf
macos_option_as_alt yes

include platform.conf

# CHU lay ban Mono, ICON lay ban thuong. Hai dong duoi day phai di CUNG NHAU.
#
# Ten cu "DejaVuSansMono" khop bang DejaVu GOC (NixOS ship san dejavu_fonts o
# tang he thong) -- khong co glyph Nerd, nen chu lay mot font con icon lay font
# khac qua fallback (do duoc: fontconfig tra ve FiraCode Nerd Font).
#
# Hau to "Mono" thi CO glyph, nhung Nerd Fonts co chung lai vua dung MOT o.
# Do bang fontTools tren chinh file font, don vi em:
#
#            ban thuong        ban Mono
#   U+F09B   0.894 x 0.872     0.602 x 0.587    <- icon thap di 33%
#   U+F015   1.038 x 0.923     0.602 x 0.535
#   U+E0B0   0.638 x 1.175     0.638 x 1.175    <- powerline KHONG bi co
#
# Vi mui ten powerline khong doi con icon thi co, trieu chung doc ra la "icon
# nho" chu khong phai "chu nho" -- rat de chan doan nham sang DPI.
#
# Vay sao khong dat thang ban thuong lam font chu? DA THU, kitty TU CHOI: chi
# ban Mono duoc fontconfig gan spacing=100, ban thuong de trong, ma kitty bat
# font chu chinh phai la monospace. Trieu chung la no am tham roi ve DejaVu goc
# (thay trong `kitty --debug-font-fallback`), tuc quay lai dung benh cu.
# Nen: Mono lam font chu, symbol_map keo rieng dai icon sang ban thuong.
#
# Sau dai codepoint duoi day KHONG chep tu tai lieu Nerd Fonts ma TINH ra bang
# cach so bbox tung glyph giua hai file: 9563 codepoint bi co, gom lai vua 6
# khoi (quet them 891 codepoint khong bi co -- vo hai, cung mot ho font).
#
# Danh doi: icon rong 0.894em > o 0.602em nen tran sang o ben canh; kitty ve de
# len o trong ke tiep. Voi p10k (luon co khoang trang quanh icon) thi khong sao.
# Neu co ky tu bi de, dung `narrow_symbols` chu dung quay ve ban Mono.
#
# Ho font den tu nerd-fonts.dejavu-sans-mono trong home-manager/environments/
# fonts, co tren ca mac lan Linux. File nay la symlink out-of-store nen sua
# khong can rebuild, nhung cua so kitty dang mo van giu font cu -- mo cua so moi.
font_family family="DejaVuSansM Nerd Font Mono"
symbol_map U+23FB-U+23FE,U+2665-U+26A1,U+2B58,U+E000-U+E3E3,U+E5FA-U+F533,U+F0001-U+F1AF0 DejaVuSansM Nerd Font
font_size 18.0

hide_window_decorations yes
term xterm-256color
tab_separator       "|"
tab_title_template  " {index} {title} "
tab_bar_edge top
# tab_bar_style hidden

kitty_mod ctrl+shift
map kitty_mod+r load_config_file

map kitty_mod+h previous_tab
map kitty_mod+l next_tab

map kitty_mod+up move_tab_backward
map kitty_mod+down move_tab_forward

map kitty_mod+9 set_background_opacity 1.0
map kitty_mod+0 set_background_opacity default

