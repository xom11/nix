include theme.conf

background_opacity 0.95
dynamic_background_opacity yes
allow_remote_control yes

# FIX: ssh clipboard OSC 52 
clipboard_control write-clipboard write-primary read-clipboard read-primary 
confirm_os_window_close 0
enable_blur true
remember_window_size  yes
tab_bar_style separator
include current-theme.conf
macos_option_as_alt yes

include platform.conf

# TEXT from the Mono build, ICONS from the regular one. These two lines belong
# together.
#
# The old name "DejaVuSansMono" matched plain DejaVu, which has no Nerd glyphs, so
# icons came from whatever fontconfig fell back to. The "Mono" suffix does carry
# them, but Nerd Fonts squeezes those into a single cell -- measured with fontTools
# in em units: icon glyphs shrink about 33% while powerline arrows do NOT, so the
# symptom reads as "small icons", not "small text", and is easily misdiagnosed as
# a DPI problem.
#
# Using the regular build as the text font does not work: kitty requires the main
# font to be monospace, and only the Mono build gets fontconfig's spacing=100. It
# silently falls back to plain DejaVu instead -- visible in
# `kitty --debug-font-fallback` -- which is the original bug again.
#
# The six ranges below were COMPUTED by diffing per-glyph bboxes between the two
# files (9563 shrunken codepoints, collapsing into six blocks), not copied from
# the Nerd Fonts docs.
#
# Trade-off: a 0.894em icon in a 0.602em cell overflows into the next cell, which
# kitty draws over. Fine with p10k, which pads around icons. If something gets
# covered, use `narrow_symbols` rather than reverting to the Mono build.
#
# Out-of-store symlink, so edits need no rebuild -- but an open kitty window keeps
# the old font; open a new one.
font_family family="DejaVuSansM Nerd Font Mono"
symbol_map U+23FB-U+23FE,U+2665-U+26A1,U+2B58,U+E000-U+E3E3,U+E5FA-U+F533,U+F0001-U+F1AF0 DejaVuSansM Nerd Font
font_size 18.0

hide_window_decorations yes
term xterm-256color
tab_separator       "|"
tab_title_template  " {index} {title} "
tab_bar_edge top
# tab_bar_style hidden

kitty_mod ctrl+shift
map kitty_mod+r load_config_file

map kitty_mod+h previous_tab
map kitty_mod+l next_tab

map kitty_mod+up move_tab_backward
map kitty_mod+down move_tab_forward

map kitty_mod+9 set_background_opacity 1.0
map kitty_mod+0 set_background_opacity default

