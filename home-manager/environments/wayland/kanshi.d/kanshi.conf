# Display config for the SWAY session only.
#
# GNOME does not read this (mutter has its own monitors.xml), and neither does
# HYPRLAND -- measured: kanshi reports "applying profile 'docked'" while
# `hyprctl monitors` does not change at all. A complete false green; Hyprland
# needs its own native monitor lines.
#
# Out-of-store symlink, so edits need no rebuild -- run `kanshictl reload`.

# scale 2 is an integer ratio, so it stays sharp; 1.5 gives more room at 2560x1440.
#
# Profiles are selected by the SET of connected outputs, so they are mutually
# exclusive and order does not matter. sway gets a fallback profile for free this
# way; Hyprland cannot express "disable eDP-1 only when HDMI is present" in static
# config, so unplugging there leaves no screen.
profile docked {
    output HDMI-A-1 mode 3840x2160@60Hz position 0,0 scale 2
    output eDP-1 disable
}

# HDMI unplugged. scale 1 suits a 15.6" 1080p panel (Hyprland guesses 1.5).
profile laptop {
    output eDP-1 enable scale 1
}
