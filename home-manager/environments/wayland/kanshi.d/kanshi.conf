# Cau hinh man hinh cho phien SWAY.
#
# GNOME khong doc file nay (mutter co ~/.config/monitors.xml rieng), va HYPRLAND
# CUNG KHONG -- do tren rog 14/08/2026: kanshi in "applying profile 'docked'" roi
# "applying profile output 'eDP-1' on connected head 'eDP-1'", nhung `hyprctl
# monitors` KHONG doi gi ca. Da thu ca hai chieu: giet kanshi cu roi chay ban moi,
# van vay. Tuc kanshi bao thanh cong ma Hyprland lo di -- xanh gia hoan toan.
# Hyprland phai dung `monitor =` native trong hypr.d/hyprland.conf.
#
# kanshi khop profile theo TAP output dang cam, nen hai profile duoi day loai tru
# nhau va thu tu khong quan trong.
#
# Sua file nay KHONG can rebuild: ~/.config/kanshi/config la symlink out-of-store
# vao repo. Sua xong chay `kanshictl reload`.

# rog + LG ULTRAFINE. scale 2 la ti le NGUYEN nen net; doi lai 1920x1080 khong gian
# dung. Muon rong hon thi 1.5 (2560x1440), doi mot chu so roi reload.
profile docked {
    output HDMI-A-1 mode 3840x2160@60Hz position 0,0 scale 2
    output eDP-1 disable
}

profile laptop {
    output eDP-1 enable scale 1
}
