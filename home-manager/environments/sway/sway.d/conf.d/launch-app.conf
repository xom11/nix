# vim: ft=swayconfig

bindsym $mod+Return exec kitty

# sway-beckon.sh <BECKON_ID>: strict app-per-workspace, no flicker.
# Workspace name == BECKON_ID. Uses `beckon -r` to resolve and
# `swaymsg [app_id=...] move ... ; workspace ...` so the destination workspace
# is never displayed empty mid-transition.
#
# Cac bindsym dung $focus nay sinh ra tu configs/shortcuts/apps.toml, nam o
# ~/.config/sway-nix/launch-app.conf. Dung them binding app vao day.
set $focus exec ~/.config/sway/scripts/sway-beckon.sh

focus_on_window_activation focus
