# vim: ft=hyprlang
# Dich tay tu sway.d/config. Bo phim giu NGUYEN nhu ban sway.

$mod = SUPER
$alt = ALT
$tab = SUPER CTRL SHIFT

source = ~/.config/hypr/conf.d/shortcuts.conf
source = ~/.config/hypr/conf.d/system.conf
source = ~/.config/hypr/conf.d/tab.conf

# Binding launcher sinh ra tu configs/shortcuts/apps.linux.toml.
source = ~/.config/hypr-nix/launch-app.conf

general {
    border_size = 0
    gaps_in = 0
    gaps_out = 0
    layout = dwindle
}

decoration {
    rounding = 0
}

animations {
    enabled = false
}

# sway.d co `xwayland disable`; ban do da doi thanh `enable` (14/08/2026) vi
# Zalo va vai Electron cu la X11-only. Giu cung mot quyet dinh o day.
xwayland {
    enabled = true
}
