# vim: ft=hyprlang
# Dich tay tu sway.d/config. Bo phim giu NGUYEN nhu ban sway.

$mod = SUPER
$alt = ALT
$tab = SUPER CTRL SHIFT

# glob, khong liet ke tay tung file -- giong sway.d/config dung
# `include conf.d/*.conf`. hyprland tu glob() va tu sort ket qua nen thu tu
# van la shortcuts/system/tab nhu cu. Glob nay KHONG duoc khop 0 file (hyprland
# coi do la loi) -- an toan trong khi conf.d/ con it nhat mot file.
source = ~/.config/hypr/conf.d/*.conf

# Binding launcher sinh ra tu configs/shortcuts/apps.linux.toml.
source = ~/.config/hypr-nix/launch-app.conf

general {
    border_size = 0
    gaps_in = 0
    gaps_out = 0
    layout = dwindle
}

decoration {
    rounding = 0
}

animations {
    enabled = false
}

# sway.d co `xwayland disable`; ban do da doi thanh `enable` (14/08/2026) vi
# Zalo va vai Electron cu la X11-only. Giu cung mot quyet dinh o day.
xwayland {
    enabled = true
}
