# vim: ft=hyprlang
#
# Moi cua so TILING moi mo ra deu roi vao workspace TRONG co so thap nhat.
# Doi ung ben sway la sway.d/scripts/new-workspace.sh (sway khong co rule nao
# tuong duong -- xem ghi chu trong file do).
#
# Vi sao lai muon the: launcher la beckon, va beckon la focus-or-launch. Bam
# Cap+b lan dau thi Brave duoc LAUNCH -> cua so moi -> rule nay day no sang mot
# workspace rieng. Bam lan sau thi beckon FOCUS cua so cu -> compositor tu nhay
# sang dung workspace do. Ket qua: moi app mot workspace, va dieu huong bang
# phim app chu khong bang so workspace. ($mod+1..4 trong shortcuts.conf thanh
# gan nhu thua, co y de nguyen.)
#
# CU PHAP: Hyprland 0.56 KHONG con nhan kieu cu `class:.*`. Do tren rog
# 16/08/2026 bang `Hyprland --verify-config`:
#   windowrule = workspace emptym, class:.*    -> Config error ... invalid field
#   windowrule = match:class .*, workspace emptym -> config ok
# Va ca hai truong hop deu THOAT 0, nen phai doc output chu dung tin ma thoat.
#
# `emptym` = workspace trong dau tien tren MAN HINH hien tai. Khong dung
# `emptynm`: chu `n` bat no lay cai trong ke tiep SAU workspace dang dung, nen
# cua so dau tien cua phien (luc workspace 1 con trong) van bi day sang 2 va
# workspace 1 bien mat -- xem hyprwm/Hyprland#7153. `m` thi hien tai vo nghia vi
# rog chi bat mot man (hyprland.conf tat eDP-1), nhung dung khi nao cam lai man
# thu hai.
#
# CANH BAO ve pham vi kiem: `--verify-config` chi kiem TEN FIELD. Da do:
# `workspace emptyZZZ` cung tra ve `config ok`. Nghia la gia tri `emptym` va
# hanh vi cua `match:float false` voi dialog CHUA duoc chung minh o day, phai
# ngoi truoc may xem.
#
# `match:float false` de dialog (Save As, file picker, popup) o nguyen tai cho
# thay vi bay sang workspace rieng.
windowrule = match:class .*, match:float false, workspace emptym
