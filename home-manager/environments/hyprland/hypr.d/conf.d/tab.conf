# vim: ft=hyprlang
# Dich tay tu sway.d/conf.d/tab.conf. $tab dinh nghia o hyprland.conf.

# Pin. Ban sway hardcode `battery_qcom_battmgr_bat` — do la pin cua a14
# (Snapdragon), tren rog (Intel) khong ton tai nen phim se in ra rong. Do bang
# `upower -e` cho khong phu thuoc may.
bind = $tab, P, exec, notify-send -t 2000 "$(upower -i "$(upower -e | grep -m1 battery)" | awk '/state:/{s=$2} /percentage:/{p=$2} /energy-rate:/{w=$2} END{printf "%s %s %.1fW", s, p, w}')"

# Gio
bind = $tab, T, exec, notify-send -t 2000 "$(date +'%H:%M:%S - %d/%m/%Y')"

# Reload
bind = $tab, R, exec, hyprctl reload && notify-send -t 2000 "Hyprland config reloaded"

# Bo go: tieng Viet (lotus) / English (keyboard-us)
bind = $tab, W, exec, fcitx5-remote -s lotus && notify-send -t 2000 "Tieng Viet"
bind = $tab, E, exec, fcitx5-remote -s keyboard-us && notify-send -t 2000 "English"

# Chup man hinh. Ban sway co them `echo -n /tmp/ss.png | wl-copy` o dau — ve do
# chep DUONG DAN roi bi ve sau ghi de ngay bang ANH, nen bo.
bind = , Print, exec, grim -g "$(slurp)" /tmp/ss.png && wl-copy < /tmp/ss.png && notify-send -t 2000 "Screenshot copied to clipboard"
bind = $tab, S, exec, grim -g "$(slurp)" /tmp/ss.png && wl-copy < /tmp/ss.png && notify-send -t 2000 "Screenshot copied to clipboard"
