# vim: ft=hyprlang
# Dich tay tu sway.d/conf.d/system.conf.

# =============================================================================
# Idle & Lock — giu swayidle/swaylock cua ban sway (quyet dinh 14/08/2026:
# KHONG dung hypridle/hyprlock).
# =============================================================================
exec-once = swayidle -w timeout 900 'swaylock -f' timeout 1800 'hyprctl dispatch dpms off' resume 'hyprctl dispatch dpms on' before-sleep 'swaylock -f'

# sway dung `bindswitch`. TEN THIET BI phai khop thu `hyprctl devices` in ra
# tren chinh rog — kiem tai may, dung chep tu tai lieu.
bindl = , switch:on:Lid Switch, exec, systemctl suspend

# =============================================================================
# Power
# =============================================================================
bind = $mod $alt, L, exec, swaylock
bind = $mod $alt SHIFT, L, exec, echo -e 'Yes\nNo' | rofi -dmenu -p 'Exit hyprland session?' | grep -q Yes && hyprctl dispatch exit
bind = $mod $alt SHIFT, R, exec, echo -e 'Yes\nNo' | rofi -dmenu -p 'Reboot the system?' | grep -q Yes && systemctl reboot
bind = $mod $alt SHIFT, S, exec, echo -e 'Yes\nNo' | rofi -dmenu -p 'Shutdown the system?' | grep -q Yes && systemctl poweroff
bind = $mod $alt SHIFT, H, exec, echo -e 'Yes\nNo' | rofi -dmenu -p 'Hibernate the system?' | grep -q Yes && systemctl hibernate

# =============================================================================
# Input
# sway co ba khoi rieng (type:keyboard / type:touchpad / type:pointer);
# hyprland gop thanh mot. `pointer_accel` -> `sensitivity`, `dwt` ->
# `disable_while_typing`, `middle_emulation` -> `middle_button_emulation`.
# Sway dat accel rieng cho touchpad (-0.3) va pointer (-0.2); o day chi co mot
# `sensitivity` chung. Muon tach thi phai dung khoi `device[<ten>]` voi ten lay
# tu `hyprctl devices` — de lai lam sau khi ngoi truoc may.
# =============================================================================
input {
    repeat_rate = 30
    repeat_delay = 300
    sensitivity = -0.2
    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
        middle_button_emulation = true
    }
}

# =============================================================================
# Background Services
# Dung exec-once cho TAT CA, ke ca nhung cai sway de `exec_always`: `exec` cua
# hyprland chay lai moi lan reload, ma Tab+r la phim dung thuong xuyen — de
# `exec` thi moi lan bam se chong them mot swaybg, mot kanshi.
# =============================================================================
exec-once = mako
exec-once = swaybg -i ~/.nix/home-manager/dotfiles/images/nix-waifu.png -m fill
exec-once = wl-paste --watch cliphist store
exec-once = kanshi
exec-once = fcitx5 -rd

# =============================================================================
# Launchers (rofi)
# =============================================================================
bind = $mod, D, exec, rofi -normal-window -show drun
bind = $mod, Space, exec, rofi -normal-window -show combi
bind = $alt, Tab, exec, rofi -normal-window -show window
