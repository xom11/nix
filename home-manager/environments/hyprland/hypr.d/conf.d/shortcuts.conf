# vim: ft=hyprlang
# Dich tay tu sway.d/conf.d/shortcuts.conf.

# Am luong / do sang. bindel = bind + e (lap khi giu) + l (chay ca khi khoa man).
# KHONG dinh nghia bien $notify-... nhu ban sway: gia tri chua `$(...)`, va
# hanh vi cua bo phan tich bien hyprland voi chuoi do la thu chua ai do o day.
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume --limit 2.0 @DEFAULT_AUDIO_SINK@ 10%+ && notify-send -h string:x-canonical-private-synchronous:vol -t 2000 "$(wpctl get-volume @DEFAULT_AUDIO_SINK@)"
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 10%- && notify-send -h string:x-canonical-private-synchronous:vol -t 2000 "$(wpctl get-volume @DEFAULT_AUDIO_SINK@)"
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && notify-send -h string:x-canonical-private-synchronous:vol -t 2000 "$(wpctl get-volume @DEFAULT_AUDIO_SINK@)"
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle && notify-send -h string:x-canonical-private-synchronous:mic -t 2000 "$(wpctl get-volume @DEFAULT_AUDIO_SOURCE@)"
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 10%+ && notify-send -h string:x-canonical-private-synchronous:br -t 2000 "$(brightnessctl -m)"
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 10%- && notify-send -h string:x-canonical-private-synchronous:br -t 2000 "$(brightnessctl -m)"

# sway: `floating_modifier $mod normal`
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

bind = $mod, Q, killactive
bind = $mod, Tab, workspace, previous

# Clipboard manager
bind = $alt, V, exec, cliphist list | rofi -normal-window -dmenu | cliphist decode | wl-copy && wtype -M ctrl v -m ctrl

# Focus
bind = $mod, Left, movefocus, l
bind = $mod, Down, movefocus, d
bind = $mod, Up, movefocus, u
bind = $mod, Right, movefocus, r

bind = $mod SHIFT, Left, movewindow, l
bind = $mod SHIFT, Down, movewindow, d
bind = $mod SHIFT, Up, movewindow, u
bind = $mod SHIFT, Right, movewindow, r

bind = $mod, F, fullscreen, 0
bind = $mod, T, togglefloating

# sway co `focus parent`; dwindle khong co container cha de focus, nen
# `togglegroup` la thu gan nhat ve cong dung (gom cua so lai thanh mot tab).
bind = $mod, A, togglegroup

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4

# sway lam hai viec (`move container ...; workspace ...`); movetoworkspace da
# bao gom ca chuyen theo.
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4

# sway tach `reload` va `restart`; hyprland khong co khai niem restart rieng.
bind = $mod SHIFT, C, exec, hyprctl reload
bind = $mod SHIFT, R, exec, hyprctl reload

# sway dung `mode "resize"`, hyprland dung submap.
bind = $mod, R, submap, resize
submap = resize
binde = , J, resizeactive, -10 0
binde = , K, resizeactive, 0 10
binde = , L, resizeactive, 0 -10
binde = , semicolon, resizeactive, 10 0
binde = , Left, resizeactive, -10 0
binde = , Down, resizeactive, 0 10
binde = , Up, resizeactive, 0 -10
binde = , Right, resizeactive, 10 0
bind = , Return, submap, reset
bind = , Escape, submap, reset
bind = $mod, R, submap, reset
submap = reset
