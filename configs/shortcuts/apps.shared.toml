# Phim tat focus-or-launch — MOT file cho ca ba OS.
#
# Cu phap chuoi ung vien (beckon >= 0.9.6):
#   "A || B || C"  — thu trai sang phai, cai dau tien HANH DONG duoc thi thang.
#   Mot ung vien truot khong phai loi; no chi bo qua bac do va di tiep.
#
# Doc luc nao, boi ai:
#   Linux    generator doc luc NIX EVAL roi sinh binding compositor
#            => sua file la PHAI `nixos-rebuild switch`.
#   macOS    `beckon serve` doc luc CHAY va watch file => ~1-2 s, khong rebuild.
#   Windows  `beckon serve` doc luc CHAY. Khong do nix quan.
#
# Cap giu = ctrl+super+alt (kanata sinh; super = Cmd tren mac, Win tren
# Linux/Windows). File nay khong can biet Cap la gi.
#
# THU TU UNG VIEN: dat ten cua WINDOWS truoc, roi mac, Linux cuoi — tru khi
# ten do khop nham o OS khac, luc do tinh DUNG thang toc do. Ly do: mot ung
# vien truot phai quet catalog, gia ~463 ms tren Windows / ~79 ms macOS /
# ~3 ms Linux; nhung bac truot THU HAI tro di thi gan nhu mien phi, nen chuoi
# dai khong ton tien — chi ung vien DAU la dang ke. (Do 17/08/2026 tren ca ba
# may; so chi tiet trong `git log` cua file nay.)
#
# Validate: `beckon check <file nay> --resolve`. CI lap glob `apps.*.toml` —
# ten `apps.toml` thi KHONG khop va CI se im lang khong kiem gi.

# ── Cap + phim ──────────────────────────────────────────────────────────

# NGOAI LE cua quy tac tren, va la dong duy nhat: ten Windows dung la
# "Terminal" ("Windows Terminal" khong resolve o do), nhung dat truoc thi macOS
# mo nham Terminal.app cua Apple. Windows chiu mot bac truot o day, co y.
"ctrl+super+alt+space" = "kitty || Terminal"

# "Brave" khop o ca ba may ("Brave Browser" khong resolve tren Windows lan
# rog). Doi lai macOS tut xuong khop-chua-chu, nen "Brave Browser" giu lai lam
# duong lui — ung vien 2 khong bao gio chay khi cai dau da khop, nen mien phi.
# rog co HAI entry trung Name="Brave Web Browser"; alphabet quyet dinh cai nao
# thang va ten exact khong go duoc. Hau qua nhe: ca hai deu mo Brave.
"ctrl+super+alt+b" = "Brave || Brave Browser"

"ctrl+super+alt+c" = "Claude"
"ctrl+super+alt+d" = "Discord"

# Ba ten cho ba OS. Tren rog cai tra loi "Files" la nemo, khong phai Nautilus.
"ctrl+super+alt+f" = "File Explorer || Finder || Files"

"ctrl+super+alt+g" = "Google Gemini"
"ctrl+super+alt+h" = "Facebook"

# PWA Brave: tren rog .desktop mang URL lam Name, nen ten hien thi mot minh
# chet o do — do la ly do co ung vien URL.
"ctrl+super+alt+j" = "Tao Monitor || https://tao.lenamkhanh.xyz/"
"ctrl+super+alt+k" = "Google Keep || https://keep.google.com/"

"ctrl+super+alt+m" = "Messenger"
"ctrl+super+alt+n" = "Notion"

# Khop "System Settings" tren mac bang chua-chu — co y. `check --resolve` bao
# dong nay "long" chu khong phai loi.
"ctrl+super+alt+s" = "Settings"

"ctrl+super+alt+t" = "Telegram"
"ctrl+super+alt+y" = "YouTube"

# Chi co tren Linux + Windows; chet tren mac, chap nhan co y.
"ctrl+super+alt+z" = "Zalo"

# ── Cap + Shift + phim ──────────────────────────────────────────────────
#
# RANG BUOC RIENG WINDOWS — chord Office key. Windows giu san RegisterHotKey
# cho Ctrl+Win+Alt+Shift + 10 phim: D L N O P T W X Y va Space. Dat binding
# vao do thi `beckon serve` khong dang ky duoc va Windows tu mo app cua no.
# Chuoi ung vien KHONG cuu duoc — day la xung dot CHORD, khong phai ten app.
# Chi ap dung cho lop Cap+Shift; lop Cap tran dung thoai mai ca 26 chu.

"ctrl+super+alt+shift+a" = "Apps"
"ctrl+super+alt+shift+c" = "Google Chrome"

# XUNG DOT Office key: `d` = OneDrive tren Windows, nen dong nay dang ky THAT
# BAI o do. Chay dung tren mac va Linux. `e`, `q`, `r`, `u` con trong o lop nay.
"ctrl+super+alt+shift+d" = "DeepSeek"

"ctrl+super+alt+shift+m" = "Gmail || https://mail.google.com/"

# Chi co tren macOS.
"ctrl+super+alt+shift+v" = "VMware Fusion"
