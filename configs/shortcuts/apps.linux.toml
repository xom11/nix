# Phim tat focus-or-launch — TARGET: Linux (GNOME, sway, hyprland).
# MOT file cho ca ba, vi ca ba chay tren CUNG mot may: `beckon installed` tren
# Linux doc .desktop, nen ten app khong the khac nhau theo compositor.
#
# Doc luc EVAL (trong nix eval) o CA BA — nen sua file nay la PHAI switch.
# Khac han mac/windows, noi `beckon serve` doc luc CHAY va tu watch file.
#   GNOME    -> dconf custom-keybindings
#   sway     -> ~/.config/sway-nix/launch-app.conf  (sau switch: Tab+r)
#   hyprland -> ~/.config/hypr-nix/launch-app.conf  (sau switch: Tab+r)
#
# Cap giu = ctrl+super+alt (kanata; super = phim Windows/Super).
# Ten khop CHINH XAC `beckon installed`: exact ~57ms, truot = quet catalog ~400ms.
# Validate: `beckon check <file nay>` (CI cung chay, glob apps.*.toml).

# ── Cap + phim ──────────────────────────────────────────────────────────
"ctrl+super+alt+space" = "kitty"
"ctrl+super+alt+b" = "Brave"
"ctrl+super+alt+c" = "Claude"
"ctrl+super+alt+d" = "Discord"
"ctrl+super+alt+g" = "Google Gemini"
"ctrl+super+alt+h" = "Facebook"
"ctrl+super+alt+j" = "Tao Monitor"
"ctrl+super+alt+k" = "Google Keep"
"ctrl+super+alt+m" = "Messenger"
"ctrl+super+alt+n" = "Notion"
"ctrl+super+alt+s" = "Settings"
"ctrl+super+alt+t" = "Telegram Web"
"ctrl+super+alt+y" = "YouTube"
"ctrl+super+alt+z" = "Zalo"

# ── Cap + Shift + phim ──────────────────────────────────────────────────
"ctrl+super+alt+shift+b" = "Brave"
"ctrl+super+alt+shift+c" = "Google Chrome"
"ctrl+super+alt+shift+d" = "DeepSeek"
"ctrl+super+alt+shift+m" = "Gmail"
