# Nguon chan ly cho phim tat focus-or-launch tren ca bon nen tang.
# Engine la `beckon` o moi noi; file nay chi la du lieu.
#
#   Cap = cmd+ctrl+alt (macOS) / super+ctrl+alt (Windows, Linux)
#
# Khoa:
#   key                             phim trong lop
#   id                              ten beckon cho moi target khong co override
#   macos / windows / gnome / sway  override rieng target do
#                                   "" (rong) = target do KHONG bind phim nay
#
# Ten phai khop CHINH XAC voi `beckon -L` tren target do. Dua vao tang khop mo
# cua beckon la bay hieu nang: khop chinh xac ~57 ms, roi xuong quet toan
# catalog ~400 ms MOI LAN bam phim. Xem windows/modules/programs/beckon.
#
# Subset TOML cho phep: dong trong, dong #, header [[app]]/[[shift]], va
#   khoa = "gia tri"  voi gia tri trong ngoac kep, khong escape, khong comment
# cuoi dong. parse.lua va parse.ahk chi hieu chung nay va bao loi voi thu khac.
#
# ^#! + "," / "." / "/" (lop Cap+phim, KHONG phai Cap+Shift) da bi
# home-manager/dotfiles/windows/ahk/window-manager.ahk chiem giu tinh (snap
# trai/phai/full man hinh). Dat key = "," | "." | "/" trong [[app]] ma khong
# dat windows = "" se khien AHK am tham GHI DE mat binding snap do luc
# runtime -- khong loi, khong CI nao bat duoc.
#
# Them target thu nam phai sua tay ca SAU noi, khong co danh sach trung tam:
#   1. configs/shortcuts/parse.lua              M.TARGETS
#   2. configs/shortcuts/parse.lua              FIELD
#   3. configs/shortcuts/parse.ahk              FIELD (static Map trong ShortcutsParse)
#   4. configs/shortcuts/sync.sh                vong lap "for t in ..."
#   5. .github/workflows/eval.yml               vong lap doi golden
#   6. windows/tests/shortcutsParse.Tests.ps1   mang @('gnome','macos','sway','windows')
# Quen noi (6) khong CI nao bao: parse.ahk chi don gian khong dump target moi,
# nen AHK reader khong duoc kiem cho target do trong khi moi job van xanh.

# ── Lop 1: Cap + <key> ────────────────────────────────────────────────

[[app]]
key = "space"
id  = "kitty"
windows = "Terminal"

[[app]]
key = "b"
# Khong can override macos: da do 08/08/2026, "Brave" khop "Brave Browser"
# bang tang substring tren mac va khop exact tren Windows.
id  = "Brave"
# sway dung chu thuong vi sway-beckon.sh lay id lam TEN WORKSPACE.
sway = "brave"

[[app]]
key = "c"
id  = "Claude"

[[app]]
key = "d"
id  = "Discord"

[[app]]
key = "f"
id  = "File Explorer"
macos = "Finder"
gnome = ""
sway  = ""

[[app]]
key = "g"
id  = "Google Gemini"
sway = "Gemini"

[[app]]
key = "h"
id  = "Facebook"

[[app]]
