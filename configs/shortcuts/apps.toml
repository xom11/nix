# "Settings" khop "System Settings" bang substring tren mac, exact tren Windows.
# Chieu nguoc lai khong dung: "System Settings" KHONG resolve tren Windows.
id  = "Settings"
sway  = ""

[[app]]
key = "t"
# SUA 08/08/2026: id cu la "Telegram Web", va no KHONG resolve tren Windows --
# tuc Cap+t tren Windows da hong am tham. "Telegram" khop exact tren ca mac lan
# Windows nen no thanh id chung.
#
# Linux van dung PWA: o do app native CUNG duoc cai, hai thu trung ten
# "Telegram" thi beckon khong phan biet duoc, nen chon PWA la co y. Vi vay
# override khong bien mat ma DOI BEN -- tu macos sang gnome/sway.
id  = "Telegram"
gnome = "Telegram Web"
sway  = "Telegram Web"

[[app]]
key = "y"
id  = "YouTube"

[[app]]
key = "z"
id  = "Zalo"
macos = ""
sway  = ""

