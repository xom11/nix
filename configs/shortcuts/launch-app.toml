# Focus-or-launch shortcuts -- ONE file for all three OSes.
#
# Candidate syntax needs beckon >= 0.9.7 (NOT 0.9.6, which predates it by hours):
#   "A || B || C"  -- left to right, first one that can ACT wins; a miss is not
#   an error. Older builds read the whole string as ONE app name, registered the
#   hotkey successfully, then silently failed to resolve. The only sign is in
#   serve.log. a14 sat on 0.9.6 and lost six shortcuts to exactly that.
#
# Who reads this, and when:
#   Linux    read at NIX EVAL to generate compositor bindings => needs a rebuild.
#   macOS    `beckon serve` reads it live and watches the file => ~1-2 s.
#   Windows  `beckon serve` reads it live. Not managed by nix.
#
# Cap held = ctrl+super+alt, produced by kanata (super is Cmd on mac, Win
# elsewhere). This file does not need to know that.
#
# CANDIDATE ORDER: put the WINDOWS name first, then mac, then Linux -- unless
# that name mismatches elsewhere, where correctness beats speed. A missed first
# candidate costs a catalog scan (~463 ms Windows / ~79 ms macOS / ~3 ms Linux),
# but the SECOND miss onward is nearly free, so long chains are cheap. Only the
# first candidate matters.
#
# Validate: `beckon check <this file> --resolve`. CI runs exactly that on the
# beckon rev pinned in flake.lock (.github/workflows/eval.yml, job `shortcuts`).

# ── Cap + key ───────────────────────────────────────────────────────────

# The one exception to the ordering rule: the Windows name is "Terminal", but
# putting it first makes macOS open Apple's Terminal.app. Windows takes one miss
# here, deliberately.
"ctrl+super+alt+space" = "kitty || Terminal"

# "Brave" matches on all three ("Brave Browser" resolves on neither Windows nor
# rog). macOS falls back to a substring match, so the second candidate stays as a
# safety net -- free, since it never runs once the first matches.
"ctrl+super+alt+b" = "Brave || Brave Browser"

"ctrl+super+alt+c" = "Claude"
"ctrl+super+alt+d" = "Discord"

# Excalidraw PWA (brave.toml [pwa]). URL candidate covers OSes where the PWA
# is not installed yet -- it opens as a plain browser tab instead of failing.
"ctrl+super+alt+e" = "Excalidraw || https://excalidraw.com"

# One name per OS. On rog "Files" resolves to nemo, not Nautilus.
"ctrl+super+alt+f" = "File Explorer || Finder || Files"

"ctrl+super+alt+g" = "Google Gemini"
"ctrl+super+alt+h" = "Facebook"

# Brave PWAs: on rog the .desktop carries the URL as its Name, so the display
# name alone fails there -- hence the URL candidate.
"ctrl+super+alt+j" = "Tao Monitor || https://tao.lenamkhanh.xyz/"
"ctrl+super+alt+k" = "Google Keep || https://keep.google.com/"

"ctrl+super+alt+m" = "Messenger"
"ctrl+super+alt+n" = "Notion"

# Matches "System Settings" on mac by substring, deliberately. `check --resolve`
# calls this line loose, not wrong.
"ctrl+super+alt+s" = "Settings"

"ctrl+super+alt+t" = "Telegram"
"ctrl+super+alt+y" = "YouTube"

# Linux and Windows only; fails on mac, accepted.
"ctrl+super+alt+z" = "Zalo"

# ── Cap + Shift + phim ──────────────────────────────────────────────────
#
# WINDOWS-ONLY CONSTRAINT: Windows reserves Ctrl+Win+Alt+Shift plus ten keys
# (D L N O P T W X Y and Space) for the Office key. A binding there simply fails
# to register and Windows opens its own app. Candidate chains do NOT help -- the
# conflict is on the CHORD, not the name. Only affects the Cap+Shift layer.

"ctrl+super+alt+shift+a" = "Apps"
"ctrl+super+alt+shift+c" = "Google Chrome"

# Office-key conflict: `d` is OneDrive on Windows, so this line fails to register
# there. Works on mac and Linux. `e`, `q`, `r`, `u` are still free in this layer.
"ctrl+super+alt+shift+d" = "DeepSeek"

"ctrl+super+alt+shift+m" = "Gmail || https://mail.google.com/"

# macOS only.
"ctrl+super+alt+shift+v" = "VMware Fusion"
