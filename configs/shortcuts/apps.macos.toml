# Phim tat focus-or-launch — TARGET: macOS. Doc luc CHAY boi `beckon --serve`
# (launchd agent com.xom11.beckon-serve, module home-manager/programs/beckon-serve):
# sua file la watcher ap dung trong ~1-2 s, khong rebuild, khong reload gi ca.
# File hong thi beckon GIU nguyen bang cu va ban notification — sua xong tu an lai.
#
# Moi dong la mot shortcut tron ven: "to_hop" = "ten app".
#   modifier: ctrl / super (=Cmd) / alt (=Option) / shift — thu tu viet tu do
#   Cap giu = ctrl+super+alt (kanata sinh ra — file nay khong can biet Cap la gi)
#
# Ten phai khop CHINH XAC `beckon -L`: exact match ~57 ms; truot xuong quet
# catalog ~400 ms moi lan bam. Validate: `beckon --check <file nay>` (CI cung chay).
# Cac target khac: apps.windows.toml, apps.gnome.toml, apps.sway.toml — moi target mot file rieng.

# ── Cap + phim ──────────────────────────────────────────────────────────
"ctrl+super+alt+space" = "kitty"   # DUNG doi thanh "Terminal": tren mac no exact-match NHAM Terminal.app cua Apple (do 08/08/2026)
"ctrl+super+alt+b" = "Brave Browser"   # doi tu "Brave" 10/08/2026: "Brave" chi khop bang substring (tier thap nhat, phai quet catalog); "Brave Browser" khop running-name exact, khong cham catalog
"ctrl+super+alt+c" = "Claude"
"ctrl+super+alt+d" = "Discord"
"ctrl+super+alt+f" = "Finder"
"ctrl+super+alt+g" = "Google Gemini"
"ctrl+super+alt+h" = "Facebook"
"ctrl+super+alt+j" = "Tao Monitor"
"ctrl+super+alt+k" = "Google Keep"
"ctrl+super+alt+m" = "Messenger"
"ctrl+super+alt+n" = "Notion"
"ctrl+super+alt+s" = "Settings"    # khop "System Settings" bang substring
"ctrl+super+alt+t" = "Telegram"    # exact tren mac; PWA "Telegram Web" chi con la chuyen cua gnome/sway
"ctrl+super+alt+y" = "YouTube"
# z: CHU Y khong bind tren mac

# ── Cap + Shift + phim ──────────────────────────────────────────────────
"ctrl+super+alt+shift+a" = "Apps"
"ctrl+super+alt+shift+b" = "Brave Browser"
"ctrl+super+alt+shift+c" = "Google Chrome"
"ctrl+super+alt+shift+d" = "DeepSeek"   # khop "DeepSeek - Into the Unknown" bang substring
"ctrl+super+alt+shift+f" = "Firefox"
"ctrl+super+alt+shift+m" = "Gmail"
"ctrl+super+alt+shift+v" = "VMware Fusion"
