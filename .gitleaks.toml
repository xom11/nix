# A secondary layer, not the primary one.
#
# gitleaks scanned this repo's entire history and MISSED the one real key: the
# default `generic-api-key` rule matches an unbroken run of characters, while that
# value sat after `Bearer ` with a space. That is why the primary layer
# (.githooks/pre-push) compares exactly against real secrets instead of guessing
# at shapes.
#
# This file patches that specific hole, and stands as the reminder that pattern
# scanning is what catches UNKNOWN shapes -- which exact comparison cannot.

[extend]
useDefault = true

[[rules]]
id = "bearer-token-literal"
description = "Authorization header mang bearer token viet thang"
# The space between `Bearer` and the value is the whole reason for this rule.
regex = '''(?i)bearer[ \t]+[A-Za-z0-9._~+/-]{16,}={0,2}'''
keywords = ["bearer"]

[[rules.allowlists]]
# Placeholders are not secrets. `$` and `{` are already outside the character
# class above, so most cases never match; this is the second line of defence.
regexTarget = "line"
regexes = [
  '''\$\{?[A-Za-z_]''',
  '''\{env:''',
  '''process\.env\.''',
  '''\$env:''',
]

# The only exception, scoped as narrowly as possible.
#
# In VS Code's keybindings.json the field is named `key` and the value is a chord,
# which `generic-api-key` matches on the name alone. This false positive existed
# for a long time, across all three former paths of that file.
#
# Limited to one rule and one filename. pre-push still compares exactly on this
# file like any other, so the exception opens no route for a real key.
[[allowlists]]
description = "VS Code keybindings: truong ten that su la `key`"
targetRules = ["generic-api-key"]
paths = ['''keybindings\.json$''']
